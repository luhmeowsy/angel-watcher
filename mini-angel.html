<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Angel</title>
<style>
:root{--bg:#2a0b15;--panel:#3b1120;--line:#6b2a40;--ink:#fff3e8;--mute:#e3b9c4;--pink:#ff5c86;--gold:#ffc53d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1000px 600px at 50% 110%,#5a1830,var(--bg));color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
.top{position:fixed;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;padding:0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 10px;max-width:100%}
.bar b{color:var(--gold);font-size:18px;margin:0 6px}
button{font:inherit;font-weight:700;color:var(--ink);background:#4a1729;border:2px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;min-height:40px}
button.on{background:var(--gold);color:#3a1600;border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:flex;align-items:center;gap:6px;color:var(--mute);font-weight:700}
#status{color:var(--mute);font-weight:600;text-align:center;max-width:640px}
#stage{position:fixed;left:0;right:0;bottom:0;height:100%;pointer-events:none}
#angel{position:absolute;bottom:0;width:200px;height:220px;pointer-events:auto;cursor:grab;touch-action:none}
#angel svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px #0008)}
#cam{position:fixed;left:12px;bottom:12px;width:160px;border-radius:12px;border:2px solid var(--line);transform:scaleX(-1);display:none;z-index:4}
#cam.show{display:block}
body.pip .top,body.pip #cam{display:none}
body.pip #stage{height:100%}
</style>
</head>

<div class="top"><div class="bar">
  <b>Mini Angel</b>
  <button id="mMouse" class="on">Watch my cursor</button>
  <button id="mHead">Watch my head</button>
  <button id="walk">Walk</button>
  <button id="pop">Pop out on top</button>
  <label>Size <input id="size" type="range" min="0.6" max="1.8" step="0.1" value="1"></label>
  <button id="camBtn">Show camera</button>
</div>
<div id="status">Move your mouse around. Click Angel to make him jump, drag him to move him.</div></div>

const parts = {all:$('all'), head:$('head'), halo:$('halo'), wingL:$('wingL'), wingR:$('wingR'), hand:$('hand'), f1:$('f1'), f2:$('f2')};

let mode = 'mouse', walking = false, scale = 1;
let look = {x:0, y:0}, mouse = {x:innerWidth/2, y:innerHeight/2};
let posX = null, jumpV = 0, jumpY = 0, drag = null, dragMoved = false, freeY = null;
let headLook = null, lastSeen = 0;
let pip = null, loopId = 0;
const say = t => statusEl.textContent = t;

/* ---------- size & position ---------- */
function win(){ return pip || window; }
function applySize(){
  angel.style.width = 200*scale + 'px'; angel.style.height = 220*scale + 'px';
}
function place(){
  const W = win().innerWidth, w = 200*scale;
  if (posX === null) posX = (W - w)/2;
  posX = Math.max(0, Math.min(W - w, posX));
  angel.style.left = posX + 'px';
  angel.style.bottom = (freeY ?? 0) + 'px';
}
$('size').oninput = e => { scale = +e.target.value; applySize(); place(); };

/* ---------- input ---------- */
function bindPointer(doc){
  doc.addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (drag){
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
      posX = drag.px + dx;
      freeY = Math.max(0, drag.py - dy);
      place();
    }
  });
  doc.addEventListener('pointerup', () => {
    if (drag && !dragMoved) jumpV = 7;
    drag = null; angel.style.cursor = 'grab';
  });
}
angel.addEventListener('pointerdown', e => {
  drag = {x:e.clientX, y:e.clientY, px:posX, py:freeY ?? 0}; dragMoved = false;
  angel.style.cursor = 'grabbing'; e.preventDefault();
});
bindPointer(document);

/* ---------- buttons ---------- */
function setMode(m){
  mode = m;
  $('mMouse').classList.toggle('on', m === 'mouse');
  $('mHead').classList.toggle('on', m === 'head');
  if (m === 'head') startCamera(); else { stopCamera(); say('Watching your cursor.'); }
}
$('mMouse').onclick = () => setMode('mouse');
$('mHead').onclick = () => setMode('head');
$('walk').onclick = () => { walking = !walking; $('walk').classList.toggle('on', walking); if (walking) freeY = null; };
$('camBtn').onclick = () => { video.classList.toggle('show'); $('camBtn').classList.toggle('on'); };

/* ---------- camera + head tracking ---------- */
let stream = null, detector = null, detKind = '', busy = false, lastDet = 0;
const small = document.createElement('canvas'); small.width = 64; small.height = 48;
const sctx = small.getContext('2d', {willReadFrequently:true});
let prevGray = null, motion = null;

async function startCamera(){
  if (stream) return;
  say('Asking for your camera... click Allow.');
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{width:320, height:240, facingMode:'user'}, audio:false});
  } catch (err) {
    say("Couldn't use the camera (" + (err.name || 'blocked') + "). Your school may block it. Going back to the cursor.");
    stream = null; mode = 'mouse'; $('mMouse').classList.add('on'); $('mHead').classList.remove('on');
    return;
  }
  video.srcObject = stream; await video.play().catch(()=>{});
  say('Camera on. Loading face finder...');
  await loadDetector();
  say(detKind === 'motion'
    ? "Camera on. Using movement tracking (the face finder couldn't load), so move your head around."
    : 'Camera on. Angel is watching your head.');
}
function stopCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; headLook = null; video.srcObject = null;
}
async function loadDetector(){
  if (detector || detKind === 'motion') return;
  // 1) MediaPipe face detector from the web
  try {
    const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await Promise.race([
      import(V + '/vision_bundle.mjs'),
      new Promise((_, r) => setTimeout(() => r('timeout'), 9000))]);
    const files = await vision.FilesetResolver.forVisionTasks(V + '/wasm');
    const fd = await vision.FaceDetector.createFromOptions(files, {
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'},
      runningMode:'VIDEO', minDetectionConfidence:0.5});
    detector = v => {
      const r = fd.detectForVideo(v, performance.now()).detections;
      if (!r.length) return null;
      const b = r[0].boundingBox;
      return {x:(b.originX + b.width/2)/v.videoWidth, y:(b.originY + b.height/2)/v.videoHeight};
    };
    detKind = 'mediapipe'; return;
  } catch (e) {}
  // 2) Browser's built-in face detector (some Chromebooks have it)
  try {
    if ('FaceDetector' in window){
      const fd = new FaceDetector({fastMode:true, maxDetectedFaces:1});
      await fd.detect(video);
      detector = async v => {
        const r = await fd.detect(v); if (!r.length) return null;
        const b = r[0].boundingBox;
        return {x:(b.x + b.width/2)/v.videoWidth, y:(b.y + b.height/2)/v.videoHeight};
      };
      detKind = 'builtin'; return;
    }
  } catch (e) {}
  // 3) Fallback: follow whatever moves in the picture
  detKind = 'motion';
}
function motionTrack(v){
  sctx.drawImage(v, 0, 0, 64, 48);
  const d = sctx.getImageData(0, 0, 64, 48).data, g = new Uint8Array(64*48);
  let sx = 0, sy = 0, n = 0;
  for (let i = 0; i < g.length; i++){
    g[i] = (d[i*4] + d[i*4+1]*2 + d[i*4+2]) >> 2;
    if (prevGray && Math.abs(g[i] - prevGray[i]) > 28){ sx += i % 64; sy += (i / 64) | 0; n++; }
  }
  prevGray = g;
  if (n > 25){
    const p = {x:sx/n/64, y:sy/n/48};
    motion = motion ? {x:motion.x*.7 + p.x*.3, y:motion.y*.7 + p.y*.3} : p;
  }
  return motion;
}
async function detect(){
  if (busy || !stream || video.readyState < 2) return;
  busy = true;
  try {
    const p = detKind === 'motion' ? motionTrack(video) : (detector ? await detector(video) : null);
    if (p){
      // camera isn't mirrored: your left shows on the picture's right
      headLook = {x:Math.max(-1, Math.min(1, -(p.x - .5)*2.4)), y:Math.max(-1, Math.min(1, (p.y - .5)*2))};
      lastSeen = performance.now();
    }
  } catch (e) {}
  busy = false;
}

/* ---------- pop-out window that stays on top ---------- */
$('pop').onclick = async () => {
  if (pip){ pip.close(); return; }
  if (!('documentPictureInPicture' in window)){
    say('Pop-out needs a recent Google Chrome or Edge. Your browser doesn’t support it, so Angel stays in this tab.');
    return;
  }
  try {
    pip = await documentPictureInPicture.requestWindow({width:260, height:280});
  } catch (e){ say("The pop-out window was blocked."); pip = null; return; }
  document.querySelectorAll('style').forEach(s => pip.document.head.appendChild(s.cloneNode(true)));
  pip.document.body.classList.add('pip');
  pip.document.body.appendChild(stage);
  bindPointer(pip.document);
  pip.addEventListener('resize', place);
  posX = null; freeY = null; place();
  $('pop').classList.add('on'); $('pop').textContent = 'Bring back';
  say(mode === 'mouse'
    ? 'Popped out! Drag the little window to the bottom of your screen. Tip: choose "Watch my head", since the pop-out can only see your cursor while it’s over it.'
    : 'Popped out! Drag the little window to the bottom of your screen.');
  pip.addEventListener('pagehide', () => {
    document.body.appendChild(stage);
    pip = null; posX = null; freeY = null; place();
    $('pop').classList.remove('on'); $('pop').textContent = 'Pop out on top';
    startLoop();
  });
  startLoop();
};

/* ---------- animation ---------- */
function headCenter(){
  const r = parts.head.getBoundingClientRect();
  return {x:r.left + r.width/2, y:r.top + r.height/2};
}
function targetLook(){
  if (mode === 'head' && headLook && performance.now() - lastSeen < 1500)
    return {x:headLook.x, y:-0.55 + headLook.y*0.5};
  const c = headCenter(), dx = mouse.x - c.x, dy = mouse.y - c.y;
  const dist = Math.hypot(dx, dy) || 1, k = Math.min(1, dist/260);
  return {x:dx/dist*k, y:dy/dist*k};
}
const t0 = performance.now();
function frame(id){
  if (id !== loopId) return;
  const now = performance.now(), t = (now - t0)/1000;
  if (mode === 'head' && now - lastDet > 80){ lastDet = now; detect(); }

  const tg = targetLook();
  look.x += (tg.x - look.x)*0.15; look.y += (tg.y - look.y)*0.15;

  // jump
  jumpV -= 0.6; jumpY = Math.max(0, jumpY + jumpV); if (jumpY === 0) jumpV = Math.max(0, jumpV);

  // walk toward cursor
  let moving = false;
  if (walking && !drag && mode === 'mouse'){
    const goal = mouse.x - 100*scale, d = goal - posX;
    if (Math.abs(d) > 30){ posX += Math.max(-5, Math.min(5, d*0.06)); moving = true; place(); }
  }

  const lx = look.x, ly = look.y;
  let bob = Math.sin(t*2.2)*3;
  if (moving) bob -= Math.abs(Math.sin(t*12))*4;
  parts.all.setAttribute('transform', `translate(0 ${(-jumpY + bob*0.4).toFixed(2)})`);
  const flap = Math.sin(t*(moving ? 9 : 3.5))*10;
  parts.wingL.setAttribute('transform', `rotate(${(22 + flap).toFixed(2)} 86 128)`);
  parts.wingR.setAttribute('transform', `rotate(${(22 + flap).toFixed(2)} 86 128)`);

  const turn = 1 - 0.18*Math.abs(lx);
  const tilt = lx*14 - (Math.abs(lx) > 0.2 ? ly*4*Math.sign(lx) : 0);
  const hx = 100 + lx*16, hy = 109 + ly*9 + bob*0.3;
  parts.head.setAttribute('transform',
    `translate(${hx.toFixed(2)} ${hy.toFixed(2)}) rotate(${tilt.toFixed(2)}) scale(${turn.toFixed(3)} 1) translate(-100 -109)`);
  parts.halo.setAttribute('transform',
    `translate(${(lx*20).toFixed(2)} ${(ly*9 + bob*0.3 + Math.sin(t*3)*2).toFixed(2)}) rotate(${(tilt*0.6).toFixed(2)} 100 42)`);

  const handX = 134 + 10*lx, handY = 184;
  parts.hand.setAttribute('transform', `translate(${handX.toFixed(2)} ${handY}) rotate(${(lx*15).toFixed(2)})`);

  win().requestAnimationFrame(() => frame(id));
}
function startLoop(){ const id = ++loopId; win().requestAnimationFrame(() => frame(id)); }

addEventListener('resize', place);
applySize(); place(); startLoop();
}
</script>
</body>
</html>
